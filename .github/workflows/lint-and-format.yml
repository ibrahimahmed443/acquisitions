name: Lint & Format

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  lint-and-format:
    name: ESLint & Prettier
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        id: eslint
        run: npm run lint
        continue-on-error: true

      - name: Run Prettier check
        id: prettier
        run: npm run format:check
        continue-on-error: true

      - name: Generate step summary
        if: always()
        run: |
          {
            echo "## Lint & Format Results"
            echo ""
            if [ "${{ steps.eslint.outcome }}" == "success" ]; then
              echo "| ESLint  | ✅ No issues found |"
            else
              echo "| ESLint  | ❌ Issues found — run \`npm run lint:fix\` |"
            fi
            if [ "${{ steps.prettier.outcome }}" == "success" ]; then
              echo "| Prettier | ✅ All files formatted correctly |"
            else
              echo "| Prettier | ❌ Issues found — run \`npm run format\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate and fail on issues
        if: steps.eslint.outcome == 'failure' || steps.prettier.outcome == 'failure'
        run: |
          if [ "${{ steps.eslint.outcome }}" == "failure" ]; then
            echo "::error::ESLint found code quality issues. Run 'npm run lint:fix' locally to auto-fix them."
          fi
          if [ "${{ steps.prettier.outcome }}" == "failure" ]; then
            echo "::error::Prettier found formatting issues. Run 'npm run format' locally to fix them."
          fi
          exit 1
