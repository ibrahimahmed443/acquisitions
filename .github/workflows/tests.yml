name: Tests

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        id: tests
        run: npm test -- --coverage --coverageReporters=text,json-summary,lcov --forceExit
        continue-on-error: true
        env:
          NODE_ENV: test
          NODE_OPTIONS: --experimental-vm-modules
          DATABASE_URL: postgres://test:test@localhost:5432/testdb

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Generate step summary
        if: always()
        run: |
          if [ "${{ steps.tests.outcome }}" == "success" ]; then
            echo "## ✅ Tests Passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ❌ Tests Failed" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f coverage/coverage-summary.json ]; then
            STMTS=$(jq '.total.statements.pct' coverage/coverage-summary.json)
            BRANCH=$(jq '.total.branches.pct' coverage/coverage-summary.json)
            FUNCS=$(jq '.total.functions.pct' coverage/coverage-summary.json)
            LINES=$(jq '.total.lines.pct' coverage/coverage-summary.json)

            {
              echo ""
              echo "### Coverage Report"
              echo "| Metric | Coverage |"
              echo "|--------|----------|"
              echo "| Statements | ${STMTS}% |"
              echo "| Branches   | ${BRANCH}% |"
              echo "| Functions  | ${FUNCS}% |"
              echo "| Lines      | ${LINES}% |"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "_Coverage data unavailable — tests may have failed before generating a report._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Annotate test failures
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::Tests failed. Review the test output above and the uploaded coverage artifact for details."
          exit 1
